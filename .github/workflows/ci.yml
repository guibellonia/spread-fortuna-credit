# Validação de cada push e pull request: segredos, lint, testes e formato do CSV de decisões.
# Não usa banco nem a API do bureau (o dump não fica no repositório). Não usa nenhum segredo.
# Para exigir este check antes do merge na main, o admin do repositório ativa a proteção de branch
# (ver src/README.md, seção "Pipeline").
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  segredos:
    name: Segredos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Nenhum token, senha, .env ou dump versionado
        run: |
          set -eu
          falhou=0
          if git ls-files | grep -E '(^|/)\.env$|\.dump$|bureau_cache\.json$|pg16-local\.txt$'; then
            echo "::error::arquivo sensível versionado (acima)"; falhou=1
          fi
          # token do bureau (48 hex), chaves de API comuns e senha em string de conexão
          if git grep -nIE '\b[0-9a-f]{48}\b|sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{35}|nvapi-[A-Za-z0-9_-]{20,}|password=[^ <$"{]+' \
               -- ':!*.lock' ':!site/package-lock.json' ':!.github/workflows/ci.yml'; then
            echo "::error::possível segredo no código (acima)"; falhou=1
          fi
          exit $falhou

  lint:
    name: Lint (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.6.9
      - name: Erros que quebram (sintaxe, nome indefinido) - bloqueia
        run: ruff check . --select E9,F63,F7,F82 --output-format github
      - name: Avisos (imports e variáveis sem uso) - não bloqueia
        run: ruff check . --select F401,F811,F841 --output-format github --exit-zero

  testes:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt
      - run: pip install -r src/requirements.txt pytest
      - name: Regras do manual, políticas, validador, bureau, tools e agente
        run: pytest tests -q

  integracao:
    name: Integração com o banco (Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: testes
    env:
      FORTUNA_DSN: ${{ secrets.FORTUNA_DSN }}
    steps:
      - name: Sem o segredo FORTUNA_DSN, este job só avisa e passa
        if: env.FORTUNA_DSN == ''
        run: echo "::notice::segredo FORTUNA_DSN não configurado; integração com o banco pulada"
      - uses: actions/checkout@v4
        if: env.FORTUNA_DSN != ''
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: env.FORTUNA_DSN != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt
      - if: env.FORTUNA_DSN != ''
        run: pip install -r src/requirements.txt
      - name: Contagens do banco batem com o kit (10.000 histórico, 2.000 novos)
        if: env.FORTUNA_DSN != ''
        working-directory: src
        run: |
          python - <<'EOF'
          from db import consulta
          c = dict(consulta("SELECT tipo_base, count(*) n FROM hackathon.pedidos GROUP BY 1").values)
          print(c)
          assert c == {"historico": 10000, "novo": 2000}, c
          EOF

  csv:
    name: Formato dos CSVs de decisão
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Valida todo *_final.csv e decisoes_*.csv versionado (modo offline)
        run: |
          set -eu
          arquivos=$(git ls-files '*_final.csv' 'decisoes_*.csv' '**/*_final.csv' '**/decisoes_*.csv' | sort -u)
          if [ -z "$arquivos" ]; then echo "nenhum CSV de decisão versionado"; exit 0; fi
          falhou=0
          for f in $arquivos; do
            echo "::group::$f"
            python src/validar_csv.py "$f" --offline || falhou=1
            echo "::endgroup::"
          done
          exit $falhou
