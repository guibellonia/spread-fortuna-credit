# Publica no GitHub Pages: a página do time (raiz do repositório) e o painel Next.js em /dashboard/.
# O painel é estático. Os dados vêm de site/src/data/dashboard.json, gerado localmente por
# site/scripts/snapshot.py (banco + API do bureau). Este workflow não usa nenhum segredo.
name: Publica no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Um deploy por vez; não cancela o que já está em andamento.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configura o Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Instala dependências (lockfile exato, sem scripts de instalação)
        working-directory: site
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Barra dependência de produção com falha crítica conhecida
        working-directory: site
        run: npm audit --omit=dev --audit-level=critical

      - name: Build do painel
        working-directory: site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/dashboard
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Confere que nenhum id de cliente ou pedido vai para o site
        run: |
          # ids do kit têm 5 dígitos (P-00070, C-86419); 3 dígitos pegariam P-256 (curva) dentro das bibliotecas
          if grep -rIEn '\b[CP]-[0-9]{5}\b' site/src/data site/out; then
            echo "::error::o painel contém id de cliente ou pedido (acima); tire do código ou gere de novo o dashboard.json"
            exit 1
          fi

      - name: Monta o site (lista fechada + painel em /dashboard)
        run: |
          # Publica SÓ o que está nesta lista. Arquivo novo no repositório não vai para o site
          # sem ser acrescentado aqui, de propósito.
          mkdir -p _site/analysis _site/api-baseline _site/prompts _site/src _site/simulador
          cp index.html README.md _site/
          cp simulador/grade.json _site/simulador/
          cp src/README.md _site/src/
          cp prompts/README.md prompts/enio-rocha_head-de-credito_v1.md _site/prompts/
          cp api-baseline/baseline-agregado.md _site/api-baseline/
          cp analysis/resumo-abertura.md analysis/analise-banco.md analysis/analise-enio.md \
             analysis/analise-guilherme.md analysis/censura-agregado.md analysis/padroes-agregado.md \
             analysis/pendencias-agregado.md analysis/pontuacao-risco.md _site/analysis/
          # slides do pitch (entram por outro PR): publica se existirem
          if [ -f slides/index.html ]; then
            mkdir -p _site/slides
            cp slides/index.html _site/slides/
            if [ -d slides/capturas ]; then cp -r slides/capturas _site/slides/; fi
          fi
          # pitch: telas e roteiro (só HTML e texto)
          mkdir -p _site/pitch
          cp pitch/telas.html pitch/PITCH.html pitch/ROTEIRO-PITCH.md _site/pitch/
          cp -r site/out _site/dashboard

      - name: Confere que nenhum CSV com id de pedido vai para o site
        run: |
          bad=0
          while IFS= read -r f; do
            if head -n 1 "$f" | tr -d '\r' | grep -qiE '(^|,)"?id_pedido"?(,|$)'; then
              echo "::error file=$f::CSV com coluna id_pedido na publicação do site"
              bad=1
            fi
          done < <(find _site -type f -iname '*.csv')
          if [ "$bad" -ne 0 ]; then exit 1; fi

      - name: Confere que nenhum id de cliente ou pedido está no site montado
        run: |
          if grep -rIEn '\b[CP]-[0-9]{5}\b' _site; then
            echo "::error::o site montado contém id de cliente ou pedido (acima)"
            exit 1
          fi

      - name: Envia o artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}dashboard/
    steps:
      - name: Publica no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
