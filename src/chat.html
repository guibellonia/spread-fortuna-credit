<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hermes · Fortuna</title>
<style>
:root{--bg:#f7f7f4;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--bd:#e3e1d9;--acc:#b8860b;--eu:#fff7df;--err:#b42318}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#151513;--fg:#ecebe6;--mut:#a3a29b;--card:#1f1f1c;--bd:#34332e;--acc:#facc15;--eu:#2b2715;--err:#f97066}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;height:100dvh;display:flex;flex-direction:column}
header{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;gap:12px;align-items:center;justify-content:space-between}
header b{font-size:16px} header span{color:var(--mut);font-size:13px}
main{flex:1;overflow-y:auto;padding:16px;max-width:860px;width:100%;margin:0 auto}
.msg{margin:0 0 14px;padding:12px 14px;border:1px solid var(--bd);background:var(--card);border-radius:10px;white-space:pre-wrap;word-wrap:break-word}
.eu{background:var(--eu);margin-left:15%}
.meta{color:var(--mut);font-size:12px;margin-top:6px}
.erro{color:var(--err)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chips button{background:var(--card);border:1px solid var(--bd);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--bd);max-width:860px;width:100%;margin:0 auto}
input,textarea{flex:1;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px}
textarea{resize:none;height:46px}
form button{background:var(--acc);color:#1d1d1b;border:0;border-radius:8px;padding:0 16px;font:inherit;font-weight:600;cursor:pointer}
form button:disabled{opacity:.5;cursor:wait}
#chave{display:none;padding:16px;max-width:860px;margin:0 auto;width:100%}
#chave p{color:var(--mut)}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px}
</style>
</head>
<body>
<header><div><b>Hermes</b> <span>assistente de risco · Fortuna Crédito · time Spread</span></div><button class="link" id="sair" type="button">trocar chave</button></header>

<section id="chave">
  <p>Digite a chave de acesso do Hermes. Ela fica só nesta aba do navegador e some quando você fecha.</p>
  <form id="fchave"><input id="k" type="password" autocomplete="off" placeholder="chave de acesso" required><button>Entrar</button></form>
</section>

<main id="chat">
  <div class="chips" id="chips">
    <button>Como a política decide?</button>
    <button>Por que o pedido P-00070 foi aprovado?</button>
    <button>Quais padrões mais aumentam a inadimplência?</button>
    <button>E se o teto de parcela fosse 30% da renda?</button>
    <button>Quais pedidos precisam de revisão humana?</button>
  </div>
</main>
<form id="fperg"><textarea id="p" placeholder="Pergunte sobre a política, um pedido ou um padrão…" maxlength="2000"></textarea><button id="enviar">Enviar</button></form>

<script>
const $ = s => document.querySelector(s);
const guardar = { get: () => { try { return sessionStorage.getItem("hk") || "" } catch { return "" } },
                  set: v => { try { v ? sessionStorage.setItem("hk", v) : sessionStorage.removeItem("hk") } catch {} } };
let chave = guardar.get();
function tela() { const ok = !!chave; $("#chave").style.display = ok ? "none" : "block";
  $("#chat").style.display = ok ? "block" : "none"; $("#fperg").style.display = ok ? "flex" : "none"; }
function esc(t) { return t.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function md(t) { return esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>"); }
function bolha(html, cls) { const d = document.createElement("div"); d.className = "msg " + (cls || ""); d.innerHTML = html;
  $("#chat").appendChild(d); d.scrollIntoView({behavior: "smooth", block: "end"}); return d; }
async function perguntar(texto) {
  texto = texto.trim(); if (!texto) return;
  bolha(esc(texto), "eu"); $("#p").value = ""; $("#enviar").disabled = true;
  const espera = bolha("<span class='meta'>pensando e consultando as ferramentas…</span>");
  try {
    const r = await fetch("perguntar", { method: "POST", headers: { "Content-Type": "application/json", "X-Access-Key": chave },
                                        body: JSON.stringify({ pergunta: texto }) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { chave = ""; guardar.set(""); tela(); espera.remove(); return; }
    if (!r.ok) { espera.innerHTML = "<span class='erro'>" + esc(j.erro || ("erro " + r.status)) + "</span>"; return; }
    const tools = (j.tools || []).map(t => t.tool);
    espera.innerHTML = md(j.resposta || "(sem resposta)") +
      "<div class='meta'>" + esc(j.modelo || "") + (tools.length ? " · ferramentas: " + esc(tools.join(", ")) : "") + "</div>";
  } catch (e) { espera.innerHTML = "<span class='erro'>falha de conexão: " + esc(String(e)) + "</span>"; }
  finally { $("#enviar").disabled = false; $("#p").focus(); }
}
$("#fchave").addEventListener("submit", e => { e.preventDefault(); chave = $("#k").value.trim(); guardar.set(chave); $("#k").value = ""; tela(); });
$("#fperg").addEventListener("submit", e => { e.preventDefault(); perguntar($("#p").value); });
$("#p").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); perguntar($("#p").value); } });
$("#chips").addEventListener("click", e => { if (e.target.tagName === "BUTTON") perguntar(e.target.textContent); });
$("#sair").addEventListener("click", () => { chave = ""; guardar.set(""); tela(); });
tela();
</script>
</body>
</html>
